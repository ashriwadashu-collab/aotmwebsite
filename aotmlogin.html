<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Login Page</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    //height:100vh;
    //display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
}

/* Login Box */

.login-box{
    width:650px;
    height:500px;
    padding:40px;
    border-radius:20px;
    background:blueviolet;
    //backdrop-filter:blur(10px);
    box-shadow:0 0 20px rgba(0,0,0,0.2);
    color:white;
    margin:auto;
    margin-top:150px;
}

.login-box h2{
    text-align:center;
    margin-bottom:50px;
    font-size:32px;
}

/* Input Box */

.input-box{
    margin-bottom:50px;
}

.input-box input{
    width:100%;
    padding:15px;
    border:none;
    outline:none;
    border-radius:10px;
    font-size:16px;
}

/* Button */

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:rgb(6, 6, 6);
    color:#f8f6f6;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

/* Small Text */

p{
    text-align:center;
    margin-top:40px;
}

a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}


@media screen and (max-width: 768px) {

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        .login-box{
            margin:auto;
            width:auto;
            margin:15px 30px;
            height:auto;
            margin-top: 130px;
        }

    }

</style>
</head>
<body>

<div class="login-box">

    <h2>Login</h2>

    <div class="input-box">
        <input type="email" placeholder="Enter Email">
    </div>

    <div class="input-box">
        <input type="password" placeholder="Enter Password">
    </div>

    <button>Login</button>

    <p>Don't have an account? <a href="#">Signup</a></p>

</div>

</body>
</html>
